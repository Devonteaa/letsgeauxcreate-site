<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Checkout — Let’s Geaux Create</title>
  <link rel="stylesheet" href="/assets/styles.css"/>
  <script src="https://web.squarecdn.com/v1/square.js"></script>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner"><div class="nav-left">
      <a href="/" class="brand">Let’s Geaux Create</a></div>
      <nav class="links">
        <a href="/shop.html">Shop</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1>Checkout</h1>
    <div id="itemSummary" class="card" style="padding:16px;margin-top:8px;">
      <div id="summaryText">Loading item…</div>
    </div>

    <div class="card" style="padding:16px;margin-top:16px;">
      <div id="card-container"></div>
      <button id="pay" class="button primary" style="width:100%;margin-top:12px;">Pay</button>
      <div id="payStatus" class="status" style="margin-top:8px;"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><p>© <span id="year"></span> Let’s Geaux Create</p></div>
  </footer>

  <script src="/scripts/checkout.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
